# 应用服务 WEB 访问端口
server:
  port: 8080
  servlet:
    context-path: /webLog

spring:


  ######################################################################## SpringSecurity配置 ##############################################################################
  security:
    user:
      name: admin # 登录用户名
      password: 123456 # 登录密码

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


  ####################################################################### 数据库配置 ##############################################################################
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://127.0.0.1:3307/weblog?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: Weblog-HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

#=================================================================
# minio
#=================================================================
minio:
  endpoint: http://127.0.0.1:9000
  accessKey: root
  secretKey: gaogeng123
  bucketName: weblog
#######################################################################项目配置 ##############################################################################

app:
  database:
    init:
      create: true
      inserts: false

