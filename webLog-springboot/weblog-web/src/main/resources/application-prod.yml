# 应用服务 WEB 访问端口
server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/webLog}

spring:
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:mysql-server}:${DB_PORT:3306}/${DB_NAME:weblog}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:95833414}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: Weblog-HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

#=================================================================
# minio
#=================================================================
minio:
  endpoint: ${MINIO_ENDPOINT:https://glris.online/minio}
  accessKey: ${MINIO_ACCESSKEY:root}
  secretKey: ${MINIO_SECRETKEY:95833414}
  bucketName: ${MINIO_BUCKETNAME:weblog}

#=================================================================
# 数据库初始化
#=================================================================
app:
  database:
    init:
      create: ${APP_DATABASE_INIT_CREATE:true}
      inserts: ${APP_DATABASE_INIT_INSERTS:true}


