version: "3.9"

services:
  mysql-server:
    image: mysql:8.0
    container_name: mysql-server
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-95833414}
      MYSQL_DATABASE: ${DB_NAME:-weblog}
      TZ: Asia/Shanghai
    volumes:
      - ${MYSQL_DATA_HOST_PATH:-/opt/mysql}:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-95833414}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - weblog-network

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESSKEY:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRETKEY:-95833414}
      TZ: Asia/Shanghai
    volumes:
      - ${MINIO_DATA_HOST_PATH:-/opt/minio}:/data
    networks:
      - weblog-network

  weblog-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: weblog-backend:latest
    container_name: weblog-backend
    restart: unless-stopped
    depends_on:
      mysql-server:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${SERVER_PORT:-8088}:${SERVER_PORT:-8088}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8088}
      SERVER_SERVLET_CONTEXT_PATH: /webLog
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      DB_HOST: mysql-server
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-weblog}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-95833414}
      MINIO_HOST: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESSKEY: ${MINIO_ACCESSKEY:-root}
      MINIO_SECRETKEY: ${MINIO_SECRETKEY:-95833414}
      MINIO_BUCKETNAME: weblog
      APP_DATABASE_INIT_CREATE: "true"
      APP_DATABASE_INIT_INSERTS: "true"
      JAVA_OPTS: -Xms256m -Xmx512m
      LOG_PATH: ${LOG_CONTAINER_PATH:-/app/logs}
    volumes:
      - ${LOG_HOST_PATH:-/data/logs}:${LOG_CONTAINER_PATH:-/app/logs}
    networks:
      - weblog-network

networks:
  weblog-network:
    driver: bridge
