version: "3.9"

services:
  weblog-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: weblog-backend:latest
    container_name: weblog-backend
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      SERVER_SERVLET_CONTEXT_PATH: /webLog
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-server:3306/weblog?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 95833414
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESSKEY: admin
      MINIO_SECRETKEY: 95833414
      MINIO_BUCKETNAME: weblog
      APP_DATABASE_INIT_CREATE: "true"
      APP_DATABASE_INIT_INSERTS: "true"
      JAVA_OPTS: -Xms256m -Xmx512m
      LOG_PATH: ${LOG_CONTAINER_PATH:-/app/logs}
    volumes:
      - ${LOG_HOST_PATH:-/data/logs/default/main}:${LOG_CONTAINER_PATH:-/app/logs}
