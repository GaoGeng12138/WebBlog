version: "3.9"

services:
  weblog-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: weblog-backend:latest
    container_name: weblog-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      SERVER_SERVLET_CONTEXT_PATH: /webLog
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      DB_HOST: ${DB_HOST:-mysql-server}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-weblog}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 95833414
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESSKEY: admin
      MINIO_SECRETKEY: 95833414
      MINIO_BUCKETNAME: weblog
      APP_DATABASE_INIT_CREATE: "true"
      APP_DATABASE_INIT_INSERTS: "true"
      JAVA_OPTS: -Xms256m -Xmx512m
      LOG_PATH: ${LOG_CONTAINER_PATH:-/app/logs}
    volumes:
      - ${LOG_HOST_PATH:-/data/logs/default/main}:${LOG_CONTAINER_PATH:-/app/logs}
